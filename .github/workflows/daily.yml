name: Daily Briefing

# 매일 밤 한국시간 23:59에 그날 하루치를 수집 (UTC 14:59 = KST 23:59)
# 아침에 일어나면 '어제 하루'가 정리되어 있습니다.
# 시각을 바꾸려면 아래 cron의 분/시(UTC 기준)를 조정하세요.
on:
  schedule:
    - cron: "59 14 * * *"
  workflow_dispatch: {}      # GitHub 앱/웹에서 'Run workflow'로 수동 실행(딸깍)도 가능

permissions:
  contents: write             # 보고서/상태를 저장소에 커밋하기 위해 필요

# 동시에 여러 번 돌지 않도록
concurrency:
  group: daily-briefing
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      TZ: Asia/Seoul            # '어제/오늘' 날짜 계산을 한국시간 기준으로
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Generate & publish report
        run: python main.py --no-gui --publish docs

      - name: Commit results
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs data/latest.md
          if git diff --quiet --staged; then
            echo "변경 사항 없음 — 커밋 생략"
          else
            git commit -m "chore: daily briefing $(date +%F)"
            git push
          fi
